<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fehler - Caffe Julia Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #fef3c7 0%, #fed7aa 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 48px;
            max-width: 600px;
            text-align: center;
        }
        .error-icon {
            font-size: 64px;
            margin-bottom: 24px;
        }
        h1 {
            color: #78350f;
            font-size: 32px;
            margin-bottom: 16px;
        }
        p {
            color: #92400e;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #d97706;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #b45309;
        }
        .error-code {
            font-size: 12px;
            color: #a8a29e;
            margin-top: 32px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <h1>Ein Fehler ist aufgetreten</h1>
        <p>
            Entschuldigung, die angeforderte Seite konnte nicht gefunden werden
            oder es ist ein Fehler aufgetreten.
        </p>
        <a href="/" class="btn">Zurück zur Startseite</a>
        <div class="error-code">
            Fehlercode: <span id="error-code">UNKNOWN</span>
        </div>
    </div>

    <script>
        // Zeige HTTP-Fehlercode falls verfügbar
        const urlParams = new URLSearchParams(window.location.search);
        const errorCode = urlParams.get('code') || 'UNKNOWN';
        document.getElementById('error-code').textContent = errorCode;
    </script>
</body>
</html>
